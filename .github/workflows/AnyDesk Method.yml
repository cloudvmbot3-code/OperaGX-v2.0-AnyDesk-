
name: Android Cloud Phone
on: workflow_dispatch

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Cuttlefish
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget unzip
          git clone
          cd android-cuttlefish
          sudo dpkg -i ./stable/*.deb || sudo apt-get install -f -y
          sudo usermod -aG kvm,cvdnetwork,render $USER

      - name: Download Cuttlefish Images
        run: |
          mkdir cf && cd cf
          wget -q "" || true
          # Uses prebuilt cuttlefish images
          HOME=$PWD launch_cvd --daemon --gpu_mode=guest_swiftshader

      - name: Start VNC Tunnel
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          cargo install bore-cli
          bore local 6444 --to bore.pub &
          sleep 10

      - name: Keep Alive
        run: sleep 21000
