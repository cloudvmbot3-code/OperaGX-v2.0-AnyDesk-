
name: AnyDesk

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 4320
    env:
      ANYDESK_PASS: Pass@1234
      RUNTIME_MINUTES: 4320

    steps:
      - name: Kill Background Services & Free RAM
        run: |
          Write-Host "Stopping resource-hogging services..."
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue

          $services = @(
            "WSearch",
            "wuauserv",
            "DiagTrack",
            "SysMain",
            "WbioSrvc",
            "TabletInputService",
            "wisvc",
            "MapsBroker",
            "XblAuthManager",
            "XblGameSave",
            "XboxNetApiSvc"
          )
          foreach ($svc in $services) {
            Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
            Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
          }

      - name: Max Performance Power Plan & Visual Effects Off
        run: |
          Write-Host "Setting max performance mode..."
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c

          $regPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects"
          New-Item -Path $regPath -Force -ErrorAction SilentlyContinue | Out-Null
          Set-ItemProperty -Path $regPath -Name "VisualFXSetting" -Value 2 -ErrorAction SilentlyContinue

          $perfPath = "HKCU:\Control Panel\Desktop"
          Set-ItemProperty -Path $perfPath -Name "UserPreferencesMask" -Value ([byte[]](0x90,0x12,0x03,0x80,0x10,0x00,0x00,0x00)) -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $perfPath -Name "DragFullWindows" -Value "0" -ErrorAction SilentlyContinue

          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" -Name "EnableTransparency" -Value 0 -ErrorAction SilentlyContinue

      - name: Set Virtual Memory / Page File to Max
        run: |
          Write-Host "Boosting virtual memory (page file) for more usable RAM..."
          # Disable automatic page file via CIM
          $cs = Get-CimInstance -ClassName Win32_ComputerSystem
          Set-CimInstance -InputObject $cs -Property @{ AutomaticManagedPagefile = $false }

          # Remove existing page file settings
          Get-CimInstance -ClassName Win32_PageFileSetting -ErrorAction SilentlyContinue | Remove-CimInstance -ErrorAction SilentlyContinue

          # Create new page file: 8GB initial, 16GB max
          New-CimInstance -ClassName Win32_PageFileSetting -Property @{
            Name = "C:\pagefile.sys"
            InitialSize = 8192
            MaximumSize = 16384
          } -ErrorAction SilentlyContinue

          Write-Host "Virtual RAM boosted: 8GB-16GB page file set"

      - name: Wipe Desktop Icons
        run: |
          $publicDesktop = [Environment]::GetFolderPath("CommonDesktopDirectory")
          $userDesktop = "$env:USERPROFILE\Desktop"
          $targets = @("Unity Hub.lnk", "R 4.6.0.lnk", "Firefox.lnk", "Google Chrome.lnk", "Claim Rewards Here.lnk")
          foreach ($target in $targets) {
            if (Test-Path "$publicDesktop\$target") { Remove-Item "$publicDesktop\$target" -Force -ErrorAction SilentlyContinue }
            if (Test-Path "$userDesktop\$target") { Remove-Item "$userDesktop\$target" -Force -ErrorAction SilentlyContinue }
          }

      - name: Download and Force Install AnyDesk
        run: |
          $url = "https://download.anydesk.com/AnyDesk.exe"
          $dst = "$env:TEMP\AnyDesk.exe"
          Invoke-WebRequest -Uri $url -OutFile $dst

          $installDir = "C:\Program Files (x86)\AnyDesk"
          if (-not (Test-Path $installDir)) { New-Item -ItemType Directory -Path $installDir -Force | Out-Null }
          Start-Process $dst -ArgumentList "--install `"$installDir`"", "--silent", "--start-with-win" -Wait
          Remove-Item $dst -ErrorAction SilentlyContinue

      - name: Configure Unattended Access Password & Touch Injection
        run: |
          $ad = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"
          if (-not (Test-Path $ad)) { $ad = "C:\Program Files\AnyDesk\AnyDesk.exe" }

          cmd.exe /c "echo ${{ env.ANYDESK_PASS }} | `"$ad`" --set-password"

          New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" -Name "EnableUIADesktopToggle" -PropertyType DWord -Value 1 -Force -ErrorAction SilentlyContinue

          $tsPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations"
          New-ItemProperty -Path $tsPath -Name "TouchMode" -PropertyType DWord -Value 1 -Force -ErrorAction SilentlyContinue
          New-ItemProperty -Path $tsPath -Name "EnableTouchInjection" -PropertyType DWord -Value 1 -Force -ErrorAction SilentlyContinue

          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" -Name "TaskbarGlomLevel" -Value 0 -ErrorAction SilentlyContinue
          Start-Process -FilePath $ad -ArgumentList "--restart-service" -Wait

      - name: Minimize Windows & Set Low Resolution
        run: |
          $shell = New-Object -ComObject Shell.Application
          $shell.MinimizeAll()
          Set-DisplayResolution -Width 1280 -Height 720 -Force -ErrorAction SilentlyContinue

      - name: Download & Install Opera GX
        run: |
          $url = "https://net.geo.opera.com/opera_gx/stable/windows?utm_source=inf&utm_medium=gx"
          $installer = "$env:TEMP\OperaGXSetup.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "--silent=1", "--allusers=1", "--launchbrowser=0", "--desktopshortcut=1" -Wait

          $operaExe = "$env:ProgramFiles\Opera GX\opera.exe"
          if (-not (Test-Path $operaExe)) { $operaExe = "$env:ProgramFiles (x86)\Opera GX\opera.exe" }
          Start-Process -FilePath $operaExe -ArgumentList "--no-first-run"

          for ($i = 1; $i -le 15; $i++) {
            $prefPath = "$env:APPDATA\Opera Software\Opera GX Stable\Default\Preferences"
            if (Test-Path $prefPath) { break }
            Start-Sleep -Seconds 2
          }

      - name: Keep Alive
        run: |
          Write-Host "========================================="
          Write-Host "  RDP LIVE — AnyDesk Password: ${{ env.ANYDESK_PASS }}"
          Write-Host "  Virtual RAM: 8-16GB page file"
          Write-Host "  Resolution: 1280x720"
          Write-Host "  Max performance mode ON"
          Write-Host "========================================="
          Start-Sleep -Seconds (${{ env.RUNTIME_MINUTES }} * 60)
