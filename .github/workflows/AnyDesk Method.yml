
name: AnyDesk

on:
  workflow_dispatch:
  schedule:
    - cron: '50 */6 * * *'

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    env:
      ANYDESK_PASS: Pass@1234

    steps:
      - name: Kill Background Services & Free RAM
        run: |
          Write-Host "Stopping resource-hogging services..."
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue

          $services = @(
            "WSearch",
            "wuauserv",
            "DiagTrack",
            "SysMain",
            "WbioSrvc",
            "TabletInputService",
            "wisvc",
            "MapsBroker",
            "XblAuthManager",
            "XblGameSave",
            "XboxNetApiSvc"
          )
          foreach ($svc in $services) {
            Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
            Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
          }

      - name: Max Performance Power Plan & Visual Effects Off
        run: |
          Write-Host "Setting max performance mode..."
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c

          $regPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects"
          New-Item -Path $regPath -Force -ErrorAction SilentlyContinue | Out-Null
          Set-ItemProperty -Path $regPath -Name "VisualFXSetting" -Value 2 -ErrorAction SilentlyContinue

          $perfPath = "HKCU:\Control Panel\Desktop"
          Set-ItemProperty -Path $perfPath -Name "UserPreferencesMask" -Value ([byte[]](0x90,0x12,0x03,0x80,0x10,0x00,0x00,0x00)) -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $perfPath -Name "DragFullWindows" -Value "0" -ErrorAction SilentlyContinue

          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" -Name "EnableTransparency" -Value 0 -ErrorAction SilentlyContinue

      - name: Set Virtual Memory / Page File to Max
        run: |
          Write-Host "Boosting virtual memory (page file) for more usable RAM..."
          $cs = Get-CimInstance -ClassName Win32_ComputerSystem
          Set-CimInstance -InputObject $cs -Property @{ AutomaticManagedPagefile = $false }

          Get-CimInstance -ClassName Win32_PageFileSetting -ErrorAction SilentlyContinue | Remove-CimInstance -ErrorAction SilentlyContinue

          New-CimInstance -ClassName Win32_PageFileSetting -Property @{
            Name = "C:\pagefile.sys"
            InitialSize = 8192
            MaximumSize = 16384
          } -ErrorAction SilentlyContinue

          Write-Host "Virtual RAM boosted: 8GB-16GB page file set"

      - name: Wipe Desktop Icons
        run: |
          $publicDesktop = [Environment]::GetFolderPath("CommonDesktopDirectory")
          $userDesktop = "$env:USERPROFILE\Desktop"
          $targets = @("Unity Hub.lnk", "R 4.6.0.lnk", "Firefox.lnk", "Google Chrome.lnk", "Claim Rewards Here.lnk")
          foreach ($target in $targets) {
            if (Test-Path "$publicDesktop\$target") { Remove-Item "$publicDesktop\$target" -Force -ErrorAction SilentlyContinue }
            if (Test-Path "$userDesktop\$target") { Remove-Item "$userDesktop\$target" -Force -ErrorAction SilentlyContinue }
          }

      - name: Download and Force Install AnyDesk
        run: |
          $url = "https://download.anydesk.com/AnyDesk.exe"
          $dst = "$env:TEMP\AnyDesk.exe"
          Invoke-WebRequest -Uri $url -OutFile $dst

          $installDir = "C:\Program Files (x86)\AnyDesk"
          if (-not (Test-Path $installDir)) { New-Item -ItemType Directory -Path $installDir -Force | Out-Null }
          Start-Process $dst -ArgumentList "--install `"$installDir`"", "--silent", "--start-with-win" -Wait
          Remove-Item $dst -ErrorAction SilentlyContinue

      - name: Configure Unattended Access Password & Touch Injection
        shell: cmd
        run: |
          set "AD=C:\Program Files (x86)\AnyDesk\AnyDesk.exe"
          if not exist "%AD%" set "AD=C:\Program Files\AnyDesk\AnyDesk.exe"
          echo %ANYDESK_PASS% | "%AD%" --set-password

          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v EnableUIADesktopToggle /t REG_DWORD /d 1 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations" /v TouchMode /t REG_DWORD /d 1 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations" /v EnableTouchInjection /t REG_DWORD /d 1 /f

          "%AD%" --restart-service

      - name: Fetch and Display AnyDesk Connection Address
        run: |
          $confPath = "C:\ProgramData\AnyDesk\system.conf"
          $cleanId = ""

          for ($i = 1; $i -le 10; $i++) {
            if (Test-Path $confPath) {
              $content = Get-Content $confPath -Raw
              if ($content -match 'ad\.anynet\.id=(\d+)') {
                $cleanId = $Matches[1]
                break
              }
            }
            Start-Sleep -Seconds 4
          }

          $ESC = [char]27
          $Green = "$ESC[32m"
          $Yellow = "$ESC[33m"
          $Red = "$ESC[31m"
          $Reset = "$ESC[0m"

          Write-Host "${Green}====================================================${Reset}"
          Write-Host "${Green}        ANYDESK CLOUD MACHINE IS READY TO CONNECT     ${Reset}"
          Write-Host "${Green}====================================================${Reset}"
          Write-Host "${Yellow} CONNECTION ID : ${Red}${cleanId}${Reset}"
          Write-Host "${Yellow} PASSWORD      : ${Red}${{ env.ANYDESK_PASS }}${Reset}"
          Write-Host "${Green}====================================================${Reset}"

      - name: Minimize Windows & Set Low Resolution
        run: |
          $shell = New-Object -ComObject Shell.Application
          $shell.MinimizeAll()
          Set-DisplayResolution -Width 1280 -Height 720 -Force -ErrorAction SilentlyContinue

      - name: Download & Install Opera GX
        run: |
          $url = "https://net.geo.opera.com/opera_gx/stable/windows?utm_source=inf&utm_medium=gx"
          $installer = "$env:TEMP\OperaGXSetup.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "--silent=1", "--allusers=1", "--launchbrowser=0", "--desktopshortcut=1" -Wait

          $operaExe = "$env:ProgramFiles\Opera GX\opera.exe"
          if (-not (Test-Path $operaExe)) { $operaExe = "$env:ProgramFiles (x86)\Opera GX\opera.exe" }
          Start-Process -FilePath $operaExe -ArgumentList "--no-first-run"

          for ($i = 1; $i -le 15; $i++) {
            $prefPath = "$env:APPDATA\Opera Software\Opera GX Stable\Default\Preferences"
            if (Test-Path $prefPath) { break }
            Start-Sleep -Seconds 2
          }

      - name: Install Mesa3D Software OpenGL Renderer
        run: |
          Write-Host "Installing Mesa3D for software OpenGL..."

          $mesaPage = Invoke-RestMethod "https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest"
          $mesaAsset = $mesaPage.assets | Where-Object { $_.name -match "release-msvc.*\.7z$" } | Select-Object -First 1
          $mesaUrl = $mesaAsset.browser_download_url
          $mesaArchive = "$env:TEMP\mesa3d.7z"
          $mesaDir = "$env:TEMP\mesa3d"

          Invoke-WebRequest -Uri $mesaUrl -OutFile $mesaArchive

          if (-not (Test-Path "C:\Program Files\7-Zip\7z.exe")) {
            choco install 7zip -y --no-progress 2>$null
          }

          & "C:\Program Files\7-Zip\7z.exe" x $mesaArchive -o"$mesaDir" -y

          $mesaDll = Get-ChildItem -Path $mesaDir -Recurse -Filter "opengl32.dll" | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1

          if ($mesaDll) {
            Copy-Item $mesaDll.FullName "C:\Windows\System32\opengl32sw.dll" -Force -ErrorAction SilentlyContinue

            [Environment]::SetEnvironmentVariable("GALLIUM_DRIVER", "llvmpipe", "Machine")
            [Environment]::SetEnvironmentVariable("MESA_GL_VERSION_OVERRIDE", "4.5", "Machine")
            [Environment]::SetEnvironmentVariable("LIBGL_ALWAYS_SOFTWARE", "true", "Machine")

            $javaDir = (Get-Command java -ErrorAction SilentlyContinue).Source | Split-Path
            if ($javaDir) {
              Copy-Item $mesaDll.FullName "$javaDir\opengl32.dll" -Force -ErrorAction SilentlyContinue
              Write-Host "Mesa3D copied to Java: $javaDir"
            }

            $tlPaths = @(
              "$env:APPDATA\.minecraft",
              "$env:APPDATA\.tlauncher",
              "$env:USERPROFILE\.minecraft"
            )
            foreach ($p in $tlPaths) {
              if (-not (Test-Path $p)) { New-Item -ItemType Directory -Path $p -Force | Out-Null }
              Copy-Item $mesaDll.FullName "$p\opengl32.dll" -Force -ErrorAction SilentlyContinue
            }

            Write-Host "Mesa3D Software OpenGL installed successfully"
          } else {
            Write-Host "WARNING: Could not find Mesa opengl32.dll"
          }

          Remove-Item $mesaArchive -Force -ErrorAction SilentlyContinue

      - name: Keep Alive
        run: |
          $end = (Get-Date).AddMinutes(345)
          while ((Get-Date) -lt $end) {
            Write-Host ("Cloud PC Heartbeat " + (Get-Date).ToString("HH:mm:ss") + " | Active until " + $end.ToString("HH:mm:ss"))
            Start-Sleep -Seconds 60
          }
